name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chrome-alpine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name t \
            -e VNC_PASSWORD=test -e START_URL=about:blank \
            -p 6080:6080 --shm-size=256m chrome-alpine:ci
          sleep 40
          docker exec t supervisorctl status
          curl -fsS -o /dev/null http://127.0.0.1:6080/vnc.html
          echo "noVNC OK"
          docker exec t sh -c 'fc-list :lang=zh | wc -l'
          docker logs t | tail -20