[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:xvfb]
command=/bin/sh -c "Xvfb :0 -screen 0 ${SCREEN_WIDTH}x${SCREEN_HEIGHT}x${SCREEN_DEPTH} -ac -nolisten tcp"
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=openbox
priority=20
autorestart=true
startretries=10
environment=DISPLAY=":0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# 剪贴板双向同步核心：把 X11 PRIMARY 与 CLIPBOARD 双向打通
[program:autocutsel-clip]
command=autocutsel -selection CLIPBOARD -fork
priority=30
autorestart=true
environment=DISPLAY=":0"
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:autocutsel-primary]
command=autocutsel -selection PRIMARY -fork
priority=31
autorestart=true
environment=DISPLAY=":0"
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=/bin/sh -c "x11vnc -display :0 -rfbport 5900 -forever -shared -nopw -xkb -noxrecord -noxfixes -noxdamage -repeat -nowf -clip CLIPBOARD -wait 20 -defer 20"
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/bin/sh -c "websockify --web=/usr/share/novnc/ --heartbeat=30 6080 localhost:5900"
priority=50
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=/bin/sh -c "exec chromium-browser --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-breakpad --disable-component-update --disable-default-apps --disable-extensions --disable-sync --disable-features=Translate,MediaRouter,OptimizationHints,InterestFeedContentSuggestions --enable-low-end-device-mode --force-device-scale-factor=1 --no-first-run --no-default-browser-check --renderer-process-limit=1 --process-per-site --js-flags=--max-old-space-size=256 --lang=zh-CN --user-data-dir=/root/.config/chromium ${START_URL}"
priority=60
autorestart=true
startretries=10
environment=DISPLAY=":0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
