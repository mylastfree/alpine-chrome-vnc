services:
  chrome:
    build: .
    image: chrome-alpine:latest
    container_name: chrome-lite
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SCREEN_WIDTH: "1600"
      SCREEN_HEIGHT: "900"
      SCREEN_DEPTH: "24"
      VNC_PASSWORD: change-me-please
      START_URL: https://example.com
    ports:
      - "6080:6080"
    volumes:
      - ./config:/root/.config
    shm_size: 256m
    mem_limit: 600m
    memswap_limit: 1000m